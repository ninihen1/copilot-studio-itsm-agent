mcs.metadata:
  componentName: SearchKnowledgeBase
  description: Reads published articles directly from the ITSM SharePoint Knowledge Base list using the SharePoint connector.
kind: TaskDialog

modelDisplayName: Search knowledge base
modelDescription: |-
  Reads published articles from the internal ITSM Knowledge Base SharePoint list. Use this before creating a ticket when a self-service article may resolve the issue. Rank the returned articles against the user's question using ArticleNumber, Title, Keywords, Summary, and Body. Prefer exact article number, title, and keyword matches. For password reset questions, prefer KB-0001 when the user says reset, forgot, locked out, sign in, login, or cannot access their account.

inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: https://contoso.sharepoint.com/sites/ITSM

  - kind: ManualTaskInput
    propertyName: table
    value: Knowledge Base

  - kind: ManualTaskInput
    propertyName: filter
    value: ArticleStatus eq 'Published'

  - kind: ManualTaskInput
    propertyName: top
    value: 100

outputs:
  - propertyName: body

action:
  kind: InvokeConnectorTaskAction
  connectionReference: itsm_triage_agent.shared_sharepointonline.00000000000000000000000000000001
  connectionProperties:
    $kind: ConnectionProperties
    diagnostics:
    mode: Invoker

  operationId: GetItems

outputMode: All
