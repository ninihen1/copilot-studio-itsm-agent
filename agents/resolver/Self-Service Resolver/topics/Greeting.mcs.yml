mcs.metadata:
  componentName: Greeting
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Hi
      - Hello
      - Hey

  actions:
    - kind: SendActivity
      id: sendMessage_hi
      activity: Hi — what are you looking for?
